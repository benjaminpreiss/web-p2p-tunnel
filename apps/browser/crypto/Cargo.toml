[package]
name = "relay-crypto"
version = "0.0.0"
edition = "2024"
publish = false

# Keep native transport features out of the WASM build's dependency graph.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
saorsa-transport = { git = "https://github.com/WithAutonomi/saorsa-transport", rev = "e2f08388088313c82cac393afa6ca27b9ce00516", default-features = false, features = ["webrtc"] }
# Match the native diagnostic's exact PQ implementation version.
saorsa-pqc = { version = "=0.5.2", default-features = false }
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
